[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "captcha-toolkit-sdk"
version = "2.1.0"
description = "Universal CAPTCHA recognition SDK - OCR, slide detection, batch processing"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["captcha", "ocr", "ddddocr", "recognition", "slide-captcha"]
authors = [
    {name = "K2st0r", email = "k2st0r@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "ddddocr>=1.6.1,<2.0",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/K2st0r/captcha-toolkit"
Repository = "https://github.com/K2st0r/captcha-toolkit"
Donate = "https://github.com/K2st0r/captcha-toolkit#donate--鎵撹祻"
